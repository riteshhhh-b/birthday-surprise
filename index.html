<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday | A Special Surprise</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(
        ellipse at center,
        #29200e 0%,
        #0b0b0b 65%,
        #000000 100%
      );
      color: #f5d77c;
      font-family: Georgia, serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow-x: hidden;
      position: relative;
    }

    .container {
      position: relative;
      z-index: 2;
      padding: 30px;
      animation: appear 1.8s ease;
    }

    .crown {
      font-size: 55px;
      margin-bottom: 22px;
      animation: crownGlow 2.5s ease-in-out infinite alternate;
    }

    h1 {
      font-size: clamp(42px, 8vw, 85px);
      background: linear-gradient(
        120deg,
        #9d7024,
        #fff0b0,
        #d4af37,
        #fff4c9
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 18px #d4af3750);
      margin-bottom: 20px;
    }

    p {
      color: #e8d8ad;
      font-size: 18px;
      line-height: 1.8;
      margin-bottom: 35px;
    }

    button {
      background: linear-gradient(
        135deg,
        #a87920,
        #f9df83,
        #c49a35
      );
      border: none;
      padding: 17px 35px;
      border-radius: 40px;
      font-size: 17px;
      font-weight: bold;
      color: #211600;
      cursor: pointer;
      box-shadow: 0 0 25px #d4af3760;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.07);
      box-shadow: 0 0 45px #d4af37a0;
    }

    .gold-particle {
      position: fixed;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #f5d77c;
      box-shadow: 0 0 12px #ffd700;
      pointer-events: none;
      z-index: 1;
      animation: floatGold linear infinite;
    }

    @keyframes floatGold {
      0% {
        transform: translateY(0);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      80% {
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(35px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes crownGlow {
      from {
        filter: drop-shadow(0 0 5px #d4af37);
      }
      to {
        filter: drop-shadow(0 0 25px #ffd700);
      }
    }
  </style>
  <style>
    .birthday-greeting[hidden] { display: none !important; }
    .birthday-greeting.card-open {
      display: block;
      animation: cardReveal 1.5s ease both;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="crown">👑</div>

<h1>Happy Birthday</h1>
<h2 style="
  font-size: clamp(30px, 6vw, 55px);
  color: #ffe69b;
  margin-bottom: 25px;
  letter-spacing: 2px;
  text-shadow:
    0 0 12px #d4af37,
    0 0 30px #b8860b;
  animation: crownGlow 2s infinite alternate;
">
  ✨ Poonam Mam ✨
</h2>


    <p>
      Today is all about you! ✨
      <br>
      Something magical is waiting...
    </p>

    <button id="surpriseBtn">
      🎁 Open Your Surprise
    </button>
  </main>

  <script>
    // Create floating golden particles
    for (let i = 0; i < 45; i++) {
      const star = document.createElement("div");
      star.className = "gold-particle";

      star.style.left = Math.random() * 100 + "vw";
      star.style.top = (Math.random() * 100 + 100) + "vh";

      star.style.animationDuration =
        (5 + Math.random() * 7) + "s";

      star.style.animationDelay =
        (-Math.random() * 12) + "s";

      document.body.appendChild(star);
    }

    // Temporary surprise button action
    document.getElementById("surpriseBtn")
      .addEventListener("click", function () {
        
const container = document.querySelector(".container");

container.innerHTML = `
  <div class="crown">🎂</div>
  <h1>Make A Wish!</h1>
<h2 style="color:#ffe69b; margin-bottom:20px; text-shadow:0 0 20px #d4af37;">✨ Poonam Mam ✨</h2>
  <p>
    ✨ May your birthday be filled with
    happiness, love and unforgettable memories!
    ✨
  </p>
  <div style="
    font-size: 75px;
    margin: 25px 0;
    animation: crownGlow 2s infinite alternate;
  ">
    
<div id="birthdayCake" style="
  position: relative;
  width: 180px;
  height: 170px;
  margin: 10px auto 25px;
  cursor: pointer;
" title="Click to blow out the candle">

  <div id="flame" style="
    position: absolute;
    top: 8px;
    left: 84px;
    width: 13px;
    height: 23px;
    background: #ffcf43;
    border-radius: 80% 10% 80% 10%;
    transform: rotate(45deg);
    box-shadow: 0 0 22px #ffae00;
    animation: candleFlicker 0.4s infinite alternate;
  "></div>

  <div style="
    position: absolute;
    top: 34px;
    left: 87px;
    width: 7px;
    height: 38px;
    background: repeating-linear-gradient(
      45deg, #fff4c0 0 7px, #c99b35 7px 12px
    );
    border-radius: 3px;
  "></div>

  <div style="
    position: absolute;
    top: 70px;
    width: 180px;
    height: 95px;
    background: linear-gradient(
      120deg, #6b3b18, #c89142, #70401c
    );
    border-radius: 20px 20px 12px 12px;
    border-bottom: 8px solid #d4af37;
    box-shadow: 0 10px 30px #d4af3750;
  "></div>

  <div style="
    position: absolute;
    top: 65px;
    width: 180px;
    height: 28px;
    background: linear-gradient(
      90deg, #fff0b0, #d4af37, #fff0b0
    );
    border-radius: 50%;
  "></div>

  <div style="
    position: absolute;
    top: 105px;
    width: 180px;
    font-size: 15px;
    color: #fff1bb;
    text-align: center;
  ">HAPPY BIRTHDAY</div>
</div>

<p style="font-size: 14px;">
  🕯️ Tap the cake to blow out the candle!
</p>
  </div>
  <p id="birthdayGreeting" class="birthday-greeting" hidden>
Wishing you a very Happy Birthday,
dear Poonam Mam! 💛
<br><br>
May your special day bring you
endless happiness, good health,
success and beautiful memories.
<br><br>
Thank you for your guidance,
kindness and inspiration.
Thank You for comforting us in the Lab.
You are the bestest ever.
You truly deserve all the
wonderful things life has to offer.
<br><br>
✨ Stay blessed and keep smiling! ✨

  </p>
`;

      });
  </script>

<style>
  .birthday-balloon {
    position: fixed;
    bottom: -120px;
    width: 55px;
    height: 70px;
    border-radius: 50% 50% 45% 45%;
    pointer-events: none;
    z-index: 1;
    animation: balloonRise linear infinite;
  }

  .birthday-balloon.gold {
    background: radial-gradient(
      circle at 30% 25%,
      #fff2b0,
      #d4af37 45%,
      #79500b 100%
    );
  }

  .birthday-balloon.black {
    background: radial-gradient(
      circle at 30% 25%,
      #777,
      #222 50%,
      #050505 100%
    );
    border: 1px solid #b99842;
  }

  .birthday-balloon::before {
    content: "";
    position: absolute;
    width: 8px;
    height: 9px;
    background: #b99842;
    bottom: -6px;
    left: 24px;
    transform: rotate(45deg);
  }

  .birthday-balloon::after {
    content: "";
    position: absolute;
    width: 1px;
    height: 75px;
    background: #b99842;
    top: 75px;
    left: 27px;
  }

  @keyframes balloonRise {
    from {
      transform: translateY(0) rotate(-8deg);
    }
    to {
      transform: translateY(-130vh) rotate(12deg);
    }
  }
</style>
<script>
  for (let i = 0; i < 12; i++) {
    const balloon = document.createElement("div");

    balloon.className =
      "birthday-balloon " +
      (i % 2 === 0 ? "gold" : "black");

    balloon.style.left = Math.random() * 95 + "vw";

    balloon.style.animationDuration =
      (12 + Math.random() * 10) + "s";

    balloon.style.animationDelay =
      (-Math.random() * 22) + "s";

    document.body.appendChild(balloon);
  }
</script>

<style>
  @keyframes candleFlicker {
    from {
      transform: rotate(40deg) scale(0.9);
      opacity: 0.8;
    }
    to {
      transform: rotate(50deg) scale(1.15);
      opacity: 1;
    }
  }

  @keyframes smokeRise {
    from {
      transform: translateY(0);
      opacity: 0.9;
    }
    to {
      transform: translateY(-75px);
      opacity: 0;
    }
  }

  .candle-smoke {
    position: absolute;
    top: 5px;
    left: 85px;
    font-size: 28px;
    pointer-events: none;
    animation: smokeRise 2s ease-out forwards;
  }
</style>

<script>
  document.addEventListener("click", function(event) {
    const cake = event.target.closest("#birthdayCake");

    if (!cake || cake.dataset.blown === "true") {
      return;
    }

    cake.dataset.blown = "true";

    const flame = cake.querySelector("#flame");

    if (flame) {
      flame.style.display = "none";
    }

    const smoke = document.createElement("div");
    smoke.className = "candle-smoke";
    smoke.textContent = "💨";
    cake.appendChild(smoke);

    setTimeout(() => smoke.remove(), 2000);

    const wish = document.createElement("p");
    wish.textContent = "✨ Your Wish Will Come True! ✨";
    wish.style.color = "#ffe69b";
    wish.style.fontSize = "20px";
    wish.style.marginTop = "15px";
    wish.style.animation = "appear 1s ease";

    cake.insertAdjacentElement("afterend", wish);

    // Reveal the greeting card only after the candle is blown.
    setTimeout(function () {
      const card = document.getElementById("birthdayGreeting");
      if (!card) return;
      card.hidden = false;
      card.classList.add("card-open");
      card.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }, 1200);

    // Golden celebration burst
    const colors = [
      "#ffd700",
      "#fff2b0",
      "#d4af37",
      "#ffffff",
      "#b8860b"
    ];

    for (let i = 0; i < 90; i++) {
      const spark = document.createElement("div");

      spark.style.position = "fixed";
      spark.style.left = "50%";
      spark.style.top = "45%";
      spark.style.width = "7px";
      spark.style.height = "7px";
      spark.style.borderRadius = "50%";
      spark.style.background =
        colors[Math.floor(Math.random() * colors.length)];
      spark.style.boxShadow = "0 0 10px currentColor";
      spark.style.pointerEvents = "none";
      spark.style.zIndex = "9999";

      document.body.appendChild(spark);

      const angle = Math.random() * Math.PI * 2;
      const distance = 100 + Math.random() * 350;

      const x = Math.cos(angle) * distance;
      const y = Math.sin(angle) * distance;

      const animation = spark.animate(
        [
          {
            transform: "translate(-50%, -50%) scale(1)",
            opacity: 1
          },
          {
            transform:
              `translate(calc(-50% + ${x}px),
                         calc(-50% + ${y}px)) scale(0)`,
            opacity: 0
          }
        ],
        {
          duration: 1200 + Math.random() * 1000,
          easing: "ease-out",
          fill: "forwards"
        }
      );

      animation.onfinish = () => spark.remove();
    }
  });
</script>

<style>
  /* Luxury Birthday Greeting Card */
  .container .birthday-greeting {
    max-width: 520px;
    margin: 25px auto;
    padding: 30px 25px;

    background: linear-gradient(
      145deg,
      rgba(45, 33, 12, 0.95),
      rgba(10, 10, 10, 0.95)
    );

    border: 1px solid #d4af37;
    border-radius: 20px;

    color: #ffe9a1;
    font-size: 17px;
    line-height: 1.9;

    box-shadow:
      0 0 20px rgba(212, 175, 55, 0.25),
      inset 0 0 20px rgba(212, 175, 55, 0.08);

    animation: cardReveal 1.5s ease;
  }

  @keyframes cardReveal {
    from {
      opacity: 0;
      transform: translateY(35px) scale(0.95);
    }

    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  @media (max-width: 600px) {
    .container .birthday-greeting {
      padding: 22px 16px;
      font-size: 15px;
    }
  }
</style>

<style>
  .golden-heart {
    position: fixed;
    bottom: -50px;
    pointer-events: none;
    z-index: 3;
    color: #ffd700;
    text-shadow: 0 0 15px #d4af37;
    animation: heartFloat linear forwards;
  }

  @keyframes heartFloat {
    0% {
      transform: translateY(0) scale(0.6);
      opacity: 0;
    }

    20% {
      opacity: 0.9;
    }

    80% {
      opacity: 0.8;
    }

    100% {
      transform: translateY(-110vh) scale(1.3);
      opacity: 0;
    }
  }
</style>

<script>
  // Start hearts only after surprise opens
  document.getElementById("surpriseBtn")
    .addEventListener("click", function () {

      setInterval(function () {
        const heart = document.createElement("div");

        heart.className = "golden-heart";
        heart.textContent = "💛";

        heart.style.left =
          Math.random() * 95 + "vw";

        heart.style.fontSize =
          (14 + Math.random() * 20) + "px";

        heart.style.animationDuration =
          (5 + Math.random() * 4) + "s";

        document.body.appendChild(heart);

        setTimeout(function () {
          heart.remove();
        }, 9000);

      }, 650);

    }, { once: true });
</script>

<!-- Automatic Birthday Background Music -->
<audio id="birthdayMusic" loop preload="auto">
  <source src="birthday-music.mp3" type="audio/mpeg">
</audio>

<script>
  const birthdayMusic = document.getElementById("birthdayMusic");

  document.getElementById("surpriseBtn")
    .addEventListener("click", function () {
      birthdayMusic.volume = 0.6;

      birthdayMusic.play().catch(function(error) {
        console.log("Music could not start:", error);
      });
    });
</script>

<style>
  /* Mobile Responsive Birthday Website */
  @media screen and (max-width: 600px) {
    body {
      min-height: 100svh;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 100%;
      padding: 25px 18px;
    }

    h1 {
      font-size: clamp(36px, 10vw, 52px);
      line-height: 1.2;
    }

    h2 {
      font-size: 28px !important;
      line-height: 1.4;
    }

    .crown {
      font-size: 45px;
    }

    .container p {
      font-size: 15px;
      line-height: 1.8;
    }

    .container button {
      max-width: 100%;
      padding: 15px 25px;
      font-size: 15px;
    }

    #birthdayCake {
      transform: scale(0.9);
      transform-origin: center;
    }

    .container p:last-child {
      max-width: 100%;
      padding: 22px 18px;
      font-size: 15px;
      line-height: 1.9;
    }

    .birthday-balloon {
      width: 40px;
      height: 55px;
    }
  }
</style>
</body>
</html>
